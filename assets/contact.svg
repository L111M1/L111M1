<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210" role="img" aria-labelledby="title desc">
  <title id="title">Email contact</title>
  <desc id="desc">Contact L111M1 at 2457966403@qq.com</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F5FF"/>
      <stop offset=".5" stop-color="#7B2FFF"/>
      <stop offset="1" stop-color="#FF00C8"/>
    </linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="0">
