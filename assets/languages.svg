<svg xmlns="http://www.w3.org/2000/svg" width="360" height="210" viewBox="0 0 360 210" role="img" aria-labelledby="title desc">
  <title id="title">Language distribution</title>
  <desc id="desc">Python 80.1%, TypeScript 18.8%, CSS 1.0%, JavaScript 0.1%, HTML 0.1%</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F5FF"/>
      <stop offset=".5" stop-color="#7B2FFF"/>
      <stop offset="1" stop-color="#FF00C8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="358" height="208" rx="12" fill="#0D1117" stroke="url(#border)" stroke-width="2"/>
  <path d="M1 27V1h26M333 1h26v26M359 183v26h-26M27 209H1v-26" fill="none" stroke="#00F5FF" stroke-width="3" filter="url(#glow)"/>

  <g font-family="'JetBrains Mono','Segoe UI',monospace">
    <text x="24" y="36" fill="#00F5FF" font-size="15" font-weight="700">&gt; LANGUAGE_MATRIX</text>
    <text x="24" y="54" fill="#667085" font-size="9">PUBLIC CODE DISTRIBUTION</text>

    <g font-size="11">
      <circle cx="28" cy="79" r="4" fill="#00F5FF"/>
      <text x="40" y="83" fill="#C9D1D9">Python</text>
      <text x="140" y="83" fill="#00F5FF" text-anchor="end">80.1%</text>

      <circle cx="28" cy="103" r="4" fill="#FF00C8"/>
      <text x="40" y="107" fill="#C9D1D9">TypeScript</text>
      <text x="140" y="107" fill="#FF00C8" text-anchor="end">18.8%</text>

      <circle cx="28" cy="127" r="4" fill="#FCEE0A"/>
      <text x="40" y="131" fill="#C9D1D9">CSS</text>
      <text x="140" y="131" fill="#FCEE0A" text-anchor="end">1.0%</text>

      <circle cx="28" cy="151" r="4" fill="#B5FF35"/>
      <text x="40" y="155" fill="#C9D1D9">JavaScript</text>
      <text x="140" y="155" fill="#B5FF35" text-anchor="end">0.1%</text>

      <circle cx="28" cy="175" r="4" fill="#FF6B35"/>
      <text x="40" y="179" fill="#C9D1D9">HTML</text>
      <text x="140" y="179" fill="#FF6B35" text-anchor="end">0.1%</text>
    </g>

    <g transform="rotate(-90 265 119)">
      <circle cx="265" cy="119" r="57" fill="none" stroke="#171D27" stroke-width="18"/>
      <circle cx="265" cy="119" r="57" pathLength="100" fill="none" stroke="#00F5FF" stroke-width="18" stroke-dasharray="80.07 19.93"/>
      <circle cx="265" cy="119" r="57" pathLength="100" fill="none" stroke="#FF00C8" stroke-width="18" stroke-dasharray="18.79 81.21" stroke-dashoffset="-80.07"/>
      <circle cx="265" cy="119" r="57" pathLength="100" fill="none" stroke="#FCEE0A" stroke-width="18" stroke-dasharray=".96 99.04" stroke-dashoffset="-98.86"/>
      <circle cx="265" cy="119" r="57" pathLength="100" fill="none" stroke="#B5FF35" stroke-width="18" stroke-dasharray=".10 99.90" stroke-dashoffset="-99.82"/>
      <circle cx="265" cy="119" r="57" pathLength="100" fill="none" stroke="#FF6B35" stroke-width="18" stroke-dasharray=".08 99.92" stroke-dashoffset="-99.92"/>
    </g>
    <text x="265" y="116" fill="#FFFFFF" font-size="22" font-weight="700" text-anchor="middle">5</text>
    <text x="265" y="133" fill="#8B949E" font-size="9" text-anchor="middle">LANGS</text>
  </g>
